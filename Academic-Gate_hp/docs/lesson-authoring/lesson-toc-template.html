     ★ html/<接頭辞>.html として置く前提のパス（../css、../js）。docs/ に置いたまま開いても CSS は読めない。
     置き換えるもの：<接頭辞>・シリーズ名・学問名・説明・部・章・行。?v=rNN はいまの番号に（tools/bump.sh がそろえる）。
     英語版（html/en/<接頭辞>.html）は tools/make-en.sh で写し、文を英訳し、data-unit を英語に（節 → section、記事 → article）。
     ★ 注釈の中に、生のスタイルタグやスクリプトタグを書かない（DESIGN.md §137.2） -->

           節を書き上げたら、その節の div を a に変えるだけ。プレビューの §の見出しは記事の目次レールから自動で読む。
         ★ 部の無いシリーズは .toc-part を使わず、.toc-layout__list の直下に .toc-ch を並べ、章の見出しを h2 にする（phys-math.html の形）。
