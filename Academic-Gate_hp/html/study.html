        <div class="page-header">
                <h1>勉強の軌跡</h1>
            <p>分野ごとの学習記録と教材。公式を覚えることではなく、原理から積み上げることを目的にしています。</p>
        </div>

        <!-- 分野カード。グリッドとカードは blog / videos / sns と同じ共有ルールを
             そのまま使っている（セレクタ名を足しただけで、値は変えていない）。
             中身がある分野だけ <a>、無い分野は <div> にしてある。押せない5枚は
             role を持たないので、支援技術から link / button として読まれない。
             見た目は「見出しの色（アクセント青 / 白）」と「ホバーの有無」で分かれる。
             枠線は揃えたまま — 薄くすると disabled に見えるが、記事が無い分野は
             無効なのではなく中身がないだけなので（§38.3）。 -->
        <section class="study-grid">
            <h2>学問分野</h2>

            <a class="study-card" href="study_physics.html">
                <h3>物理学</h3>
                <p>素粒子から宇宙まで、自然の仕組みを数式で読み解く</p>
            </a>
            <div class="study-card">
                <h3>数学</h3>
                <p>公理・定義を土台に、論理的な推論で真理を追求する</p>
            </div>
            <div class="study-card">
                <h3>化学</h3>
                <p>物質の構造や性質、反応や変化の仕組みを知る</p>
            </div>
            <div class="study-card">
                <h3>生物学</h3>
                <p>分子から生態系まで、生命の神秘を探る</p>
            </div>
            <div class="study-card">
                <h3>歴史学</h3>
                <p>過去の選択の積み重ねから、人類の軌跡を辿る</p>
            </div>
        </section>

        <!-- 精神の圏域は学問分野と性質が違う（基礎／専門の区分を持たない）ので節を分ける。
             この節のグループ名はカード名そのものなので h2 は置かない — 置くと
             「精神の圏域」が2行続けて並ぶだけになる。blog.html と同じく、見出しブロックの
             直後にグリッドが来る形（§38.4）。
             ★ この節にあった eyebrow（「03 — Orbis Mentis」）は §69.2 で削った。
             番号付きの小見出しはこのページには不要だという判断。ラテン語名は
             分野ページの h1「精神の圈域（Orbis Mentis）」で一度紹介しているので、
             ここで出さなくても名前は失われない。カードとパンくずは短い
             「精神の圈域」を繰り返す。
             中身ができたのでカードは <a>（§37.4「中身があるものだけリンク」）。
             行き先は分野ページ study_skills.html。その下は 技能 → シリーズ → 記事 と
             続く 5 階層（§49）。 -->
        <section class="study-grid">

            <a class="study-card" href="study_skills.html">
                <h3>精神の圏域</h3>
                <p>頭の中に空間を作り、そこで覚え、考え、計算する</p>
            </a>
        </section>
