                <h1>勉強の軌跡</h1>
            <p>分野ごとの学習記録と教材。公式を覚えることではなく、原理から積み上げることを目的にしています。</p>
        </div>

        <!-- 分野カード。グリッドとカードは blog / videos / sns と同じ共有ルールを
             そのまま使っている（セレクタ名を足しただけで、値は変えていない）。
             中身がある分野だけ <a>、無い分野は <div> にしてある。押せない5枚は
             role を持たないので、支援技術から link / button として読まれない。
             見た目は「見出しの色（アクセント青 / 白）」と「ホバーの有無」で分かれる。
             枠線は揃えたまま — 薄くすると disabled に見えるが、記事が無い分野は
             無効なのではなく中身がないだけなので（§38.3）。 -->
        <section class="study-path">
            <!-- 中身がある分野だけリンクにする。無い分野は平文のまま置く（§37）。
                 「準備中」のようなラベルは足さない。リンクの無効化（disabled や
                 グレーアウト）も使わない — 押せそうで押せない要素は支援技術にも
                 不親切で、平文のほうが状態を正しく表すため。 -->
            <p class="eyebrow"><span class="eyebrow__num">02</span> — Fields</p>

            </ul>

                 訓練法の平坦なリストになる）。全ページ共通の eyebrow の連番で
                 区切るだけにして、隠しも混ぜもしない。 -->
