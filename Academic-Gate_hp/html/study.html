<body data-page="study">
<div id="site-nav"><noscript><nav class="noscript-nav" aria-label="メインナビゲーション"><a href="index.html">ホーム</a><a href="self-intro.html">自己紹介</a><a href="study.html">勉強の軌跡</a><a href="videos.html">動画</a><a href="blog.html">ブログ</a><a href="sns.html">各種SNS</a></nav></noscript></div>
    <main>
        <section class="study-path">
            <p class="eyebrow"><span class="eyebrow__num">01</span> — 勉強の軌跡</p>
                <h2>物理学の勉強</h2>
            <div class="accordion">
                <div class="accordion-block">
                    <button class="accordion-toggle">基礎領域（学部レベル）</button>
                    <div class="accordion-content">
                        <ul>
                            <li>物理数学</li>
                            <li>古典力学</li>
                            <li>解析力学</li>
                            <li>電磁気学</li>
                            <li>熱力学</li>
                            <li>統計力学</li>
                            <li>量子力学</li>
                            <li>特殊相対性理論</li>
                        </ul>
                    </div>
                </div>
                <div class="accordion-block">
                    <button class="accordion-toggle">専門領域（素粒子・重力理論）</button>
                    <div class="accordion-content">
                        <ul>                        
                            <li>場の量子論</li>
                            <li>一般相対性理論</li>
                            <li>宇宙論</li>
                        </ul>
                    </div>
                </div>
                <div class="accordion-block">
                    <button class="accordion-toggle">行間埋めノート</button>
                    <div class="accordion-content">
                        <ul>                        
                            <li>
                                <button class="accordion-toggle">Quantum Field Theory</button>
                                <ul class="accordion-content" style="display:none;">
                                    <li><a href="peskin-qft.html">Peskin & Schroeder. An Introduction to Quantum Field Theory</a></li>
                                </ul>
                            </li>
                            <li>General Relativity</li>
                            <li>Cosmology</li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
        <section class="knowledge-map">
            <p class="eyebrow"><span class="eyebrow__num">02</span> — The Knowledge Map</p>
                <h1>Archive Sphere</h1>
            <div class="graph-controls">
                <button id="toggleControls" class="control-toggle-button">コントロールパネル</button>
                <div class="control-panel">
                    <div class="control-group">
                        <h3>表示</h3>
                        <div class="control-item">
                            <label>
                                <input type="checkbox" id="showTags" checked>
                                タグ
                            </label>
                        </div>
                        <div class="control-item">
                            <label>
                                <input type="checkbox" id="showPDFs" checked>
                                PDF資料
                            </label>
                        </div>
                        <div class="control-item">
                            <label>
                                <input type="checkbox" id="showOrphans" checked>
                                オーファン
                            </label>
                        </div>
                    </div>
                    <div class="control-group">
                        <h3>表示設定</h3>
                        <div class="control-item">
                            <label>
                                矢印
                                <input type="checkbox" id="showArrows">
                            </label>
                        </div>
                        <div class="control-item">
                            <label>
                                ノードの大きさ
                                <input type="range" id="nodeSize" min="4" max="20" value="8">
                            </label>
                        </div>
                        <div class="control-item">
                            <label>
                                リンクの太さ
                                <input type="range" id="linkWidth" min="1" max="5" value="1.5">
                            </label>
                        </div>
                        <div class="control-item">
                            <label>
                                リンクの距離
                                <input type="range" id="linkDistance" min="50" max="200" value="100">
                            </label>
                        </div>
                    </div>
                    <button id="startAnimation" class="control-button">アニメーション開始</button>
                    <button id="resetCamera" class="control-button" style="margin-top: 1rem; background: rgba(255,61,139,0.15); border-color: var(--accent-warm);">カメラリセット</button>
                    <button id="toggleFullscreen" class="control-button" style="margin-top: 1rem; background: rgba(43,217,196,0.16); border-color: var(--spec-teal);">全画面表示</button>
                </div>
            </div>
            <div id="graph-container"></div>
        </section>
    </main>
    <div id="site-footer"><noscript><nav class="noscript-nav" aria-label="フッターナビゲーション"><a href="index.html">ホーム</a><a href="self-intro.html">自己紹介</a><a href="study.html">勉強の軌跡</a><a href="videos.html">動画</a><a href="blog.html">ブログ</a><a href="sns.html">各種SNS</a></nav></noscript></div>
    <script src="../js/knowledge-graph.js"></script>
    <script>
    // アコーディオン動作（複数ブロック対応）
    document.addEventListener('DOMContentLoaded', function() {
        const toggles = document.querySelectorAll('.accordion-toggle');
        toggles.forEach(function(toggle) {
            toggle.addEventListener('click', function() {
                const content = toggle.nextElementSibling;
                if(content.style.display === 'block') {
                    content.style.display = 'none';
                } else {
                    content.style.display = 'block';
                }
            });
            // 初期状態は収納
            toggle.nextElementSibling.style.display = 'none';
        });
    });
    </script>
