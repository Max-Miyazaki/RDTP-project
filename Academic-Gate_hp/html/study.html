            <!-- 分野 → 科目 → 章 → 節 の目次。
                 ・分野 = 基礎領域 / 専門領域（従来のアコーディオンをそのまま使う）
                 ・科目 = 物理数学・古典力学 … 記事がある科目だけ入れ子アコーディオンにし、
                   無い科目は平文のまま置く。開けるかどうかで中身の有無が分かるので、
                   「準備中」のようなラベルを足さない（DESIGN.md §36）
                 ・章 = 平文（章が増えたら <button class="accordion-toggle"> に差し替えるだけで
                   折りたためる。JS は入れ子に対応済み）
                 ・節 = 記事へのリンク
                 新しい CSS クラスは足さず、既存の .accordion-* と <ul> の字下げで階層を出す。 -->
            <div class="accordion">
                <div class="accordion-block">
                    <button class="accordion-toggle" aria-expanded="false" aria-controls="ac-foundation">基礎領域（学部レベル）</button>

                                            </ul>
                                        </li>

                                </div>
                            </li>

    <script>
    // アコーディオン動作（入れ子対応）。開閉そのものは display の切り替えだが、
    // 支援技術のために aria-expanded を必ず同期させる。<button> なので Tab で辿れ、
    // Enter / Space で開閉できる（キーボード操作はブラウザ既定のまま）。
    document.addEventListener('DOMContentLoaded', function() {
        const toggles = document.querySelectorAll('.accordion-toggle');
        toggles.forEach(function(toggle) {
            const content = toggle.nextElementSibling;
            if (!content) return;
            // 初期状態は収納
            content.style.display = 'none';
            toggle.setAttribute('aria-expanded', 'false');
            toggle.addEventListener('click', function() {
                const open = content.style.display === 'block';
                content.style.display = open ? 'none' : 'block';
                toggle.setAttribute('aria-expanded', open ? 'false' : 'true');
            });
        });
    });
    </script>
