    <!-- 勉強の軌跡（DESIGN.md §136）。ホームの学問の樹と同じ7大分類・同じ学問を、縦に並べる。
         ★ 大分類・学問・複合分野のデータは js/disciplines.js（ホームと共有）。js/study.js が
           [data-study-bar] に分野バーを、[data-study] に7つの大分類と複合分野を書き出す。
         ★ 公開数・記事数・進捗率など、量や達成度の数字は出さない（どこからでも入れる、を優先）。
         精神の圏域（ROOTS）だけはここに直接書く（学問の樹の外。ホームの 02 根と同じ位置づけ）。 -->
    <main class="sd">
        <section class="sd-hero sd-wrap" aria-labelledby="study-h">
            <p class="eyebrow reveal">Study</p>
            <h1 id="study-h" class="reveal" lang="ja">勉強の軌跡</h1>
            <p class="sd-hero__lead reveal" lang="ja">学問の樹の、どの枝からでも。気になった学問から読み始められるように、学んだことを教材として残しています。</p>
        </section>

        <!-- 追従する分野バー（js/study.js が中身を書く。JS が無いときは出ない） -->
        <nav class="sd-bar" data-study-bar aria-label="分野へ移動" hidden></nav>

        <div class="sd-body sd-wrap">
            <div data-study></div>

            <!-- JS が無いとき：大分類のセクションは書き出されないので、ページのある学問への短い一覧だけ -->

                <section class="sd-noscript" lang="ja">
                    <h2>ページのある学問</h2>
                    <ul>
                        <li><a href="study_physics.html">物理学</a>（自然科学）</li>
                    </ul>
                </section>
            </noscript>

            <!-- ROOTS：精神の圏域。ホームの 02「根」と同じモチーフ（種から下へ伸びる根の先に技能）。
                 根の線は js/study.js が、カードの位置から描く。リンクは study_skills.html と同じ（記憶術 → メモリーバース）。 -->
            <section class="sd-cat sd-cat--roots reveal" id="roots" data-cat="roots" aria-labelledby="roots-h">
                <div class="sd-cat__head">
                    <p class="sd-cat__en">Roots</p>
                    <h2 id="roots-h" lang="ja">精神の圏域</h2>
                    <p class="sd-cat__lead" lang="ja">どの学問にも効く、学ぶための技術。頭の中に空間を作り、そこで覚え、考え、計算する。</p>
                    <p class="sd-cat__more"><a class="sd-link" href="study_skills.html">精神の圏域のページへ <span aria-hidden="true">→</span></a></p>
                </div>
                <div class="sd-roots" data-study-roots>
                    <ul class="sd-roots__list">
                        <li class="sd-root">

                            <p lang="ja">覚えたいものを、思い出せる場所に置く</p>
                            <p class="sd-root__sub"><a class="sd-link" href="memoryverse.html">メモリーバース <span aria-hidden="true">→</span></a></p>
                        </li>
                        <li class="sd-root is-soon">
                            <h3 lang="ja">推理・推論</h3>

                        </li>
                        <li class="sd-root is-soon">
                            <h3 lang="ja">暗算法</h3>

                        </li>
                    </ul>
